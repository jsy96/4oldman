<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 挂在路由前缀下时（如 /eldercare），补尾斜杠使相对路径的 JS/CSS/API 正确解析 */
if (location.pathname !== '/' && !location.pathname.endsWith('/'))
  location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:,">
<title>颐养通 · 居家养老服务</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 登录页 -->
<div id="login-view" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">颐</div>
    <h1>颐养通</h1>
    <p class="login-sub">居家养老服务管理平台</p>
    <form id="login-form">
      <label>手机号（账号）</label>
      <input id="login-phone" type="tel" inputmode="numeric" autocomplete="username"
             placeholder="请输入手机号" required>
      <label>密码</label>
      <input id="login-pwd" type="password" autocomplete="current-password"
             placeholder="请输入密码" required>
      <div id="login-err" class="login-err" hidden></div>
      <button class="btn btn-lg" type="submit">登 录</button>
    </form>
    <details class="demo-accounts">
      <summary>演示账号（首次使用请修改密码）</summary>
      <div>管理员：13900000001 / admin123</div>
      <div>服务员：13800001001 / 123456</div>
      <div>顾　客：13800002001 / 123456</div>
    </details>
  </div>
</div>

<!-- 应用外壳 -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">颐</span><span id="brand-name">颐养通</span></div>
    <div class="top-user">
      <span id="top-hello"></span>
      <button id="btn-logout" class="btn btn-ghost btn-small">退出</button>
    </div>
  </header>
  <nav id="tabbar" class="tabbar"></nav>
  <main id="main" class="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet.min.js"></script>
<script src="js/api.js"></script>
<script src="js/map.js"></script>
<script src="js/customer.js"></script>
<script src="js/worker.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
