<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 挂在路由前缀下时（如 /eldercare），补尾斜杠使相对路径的 JS/CSS/API 正确解析 */
if (location.pathname !== '/' && !location.pathname.endsWith('/'))
  location.replace(location.pathname + '/' + location.search + location.hash);
/* 注册 Service Worker：版本化静态资源本地缓存，二次打开秒开 */
if ('serviceWorker' in navigator)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:,">
<title>颐养通 · 居家养老服务</title>
<link rel="stylesheet" href="vendor/leaflet.css?v=24">
<link rel="stylesheet" href="css/style.css?v=24">
</head>
<body>

<!-- 启动占位（避免登录页闪现） -->
<div id="boot-splash" class="boot-splash">正在打开颐养通…</div>

<!-- 登录页 -->
<div id="login-view" class="login-wrap" hidden>
  <div class="login-card">
    <div class="login-logo">颐</div>
    <h1>颐养通</h1>
    <p class="login-sub">居家养老服务管理平台</p>
    <form id="login-form">
      <label>手机号（账号）</label>
      <input id="login-phone" type="tel" inputmode="numeric" autocomplete="username"
             placeholder="请输入手机号" required>
      <label>密码</label>
      <input id="login-pwd" type="password" autocomplete="current-password"
             placeholder="请输入密码" required>
      <div style="text-align:right;margin-top:6px">
        <a href="javascript:void 0" id="forgot-link" class="muted small">忘记密码？</a>
      </div>
      <div id="login-err" class="login-err" hidden></div>
      <button class="btn btn-lg" type="submit">登 录</button>
    </form>
    <details class="demo-accounts">
      <summary>演示账号（首次使用请修改密码）</summary>
      <div>管理员：13900000001 / admin123</div>
      <div>服务员：13800001001 / 123456</div>
      <div>顾　客：13800002001 / 123456</div>
    </details>
    <div class="icp-footer">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2025092414号-2</a>
    </div>
  </div>
</div>

<!-- 应用外壳 -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">颐</span><span id="brand-name">颐养通</span></div>
    <div class="top-user">
      <span id="top-hello"></span>
      <button id="btn-pwd" class="btn btn-ghost btn-small">改密</button>
      <button id="btn-logout" class="btn btn-ghost btn-small">退出</button>
    </div>
  </header>
  <nav id="tabbar" class="tabbar"></nav>
  <main id="main" class="main"></main>
  <div class="icp-footer icp-fixed">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2025092414号-2</a>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet.min.js?v=24"></script>
<script src="js/api.js?v=24"></script>
<script src="js/map.js?v=24"></script>
<script src="js/customer.js?v=24"></script>
<script src="js/worker.js?v=24"></script>
<script src="js/admin.js?v=24"></script>
<script src="js/app.js?v=24"></script>
</body>
</html>
